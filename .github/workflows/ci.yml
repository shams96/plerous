name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: Dashboard — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
        working-directory: apps/dashboard

      - name: Build
        run: npm run build
        working-directory: apps/dashboard
        env:
          # Build-time placeholder; real value injected at runtime/deploy
          NEXT_PUBLIC_API_URL: http://localhost:3001

  api:
    name: API — syntax & schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (node --check)
        run: find src -name '*.js' -print0 | xargs -0 -n1 -P4 node --check
        working-directory: apps/api

      - name: Validate Prisma schema
        run: npx prisma validate --schema=src/db/schema.prisma
        working-directory: apps/api
        env:
          # Schema parsing resolves env("DATABASE_URL"); value is unused (no DB connection)
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
