version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: refchain_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: refchain
      POSTGRES_PASSWORD: refchain_dev_pw
      POSTGRES_DB: refchain_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U refchain']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: refchain_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Redis GUI for dev
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: refchain_redis_ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - '8081:8081'
    depends_on:
      - redis
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
